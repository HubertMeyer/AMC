name: amc-sonos-broker

services:
  broker:
    build:
      context: ../..
      dockerfile: deploy/sonos-broker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SONOS_BROKER_PUBLIC_ORIGIN: https://${SONOS_BROKER_HOST}/
      SONOS_CLIENT_ID: ${SONOS_CLIENT_ID}
      SONOS_CLIENT_SECRET_FILE: /run/secrets/sonos_client_secret
      SONOS_REDIRECT_URI: https://${SONOS_BROKER_HOST}/login/callback
      SONOS_TRUSTED_PROXIES: 172.30.0.2,127.0.0.1
    secrets:
      - sonos_client_secret
    networks:
      broker_private:
        ipv4_address: 172.30.0.3
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          --header='X-Forwarded-For: 127.0.0.1'
          --header='X-Forwarded-Proto: https'
          http://127.0.0.1:8080/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      SONOS_BROKER_HOST: ${SONOS_BROKER_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      broker_private:
        ipv4_address: 172.30.0.2

secrets:
  sonos_client_secret:
    file: ./secrets/sonos_client_secret.txt

networks:
  broker_private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
